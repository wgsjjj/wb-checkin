services:
  wb-checkin:
    image: ghcr.io/wgsjjj/wb-checkin:latest
    container_name: wb-checkin
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
      # 改成你自己的访问密码，留空 = 同网段任何人可打开控制台
      WB_PASSWORD: "change-me-123456"
      WB_DOMAIN: "www.workbuddy.cn"
      # WB_SECRET: "随便一串 32 位以上字符"   # 填了才能把数据整体迁到别的机器
    volumes:
      - wb-data:/data
    # 镜像里内置了 chromium，扫码时要几百 MB 内存。内存/存储紧张的话，
    # 自建一个不带浏览器的镜像（docker build --build-arg WB_WITH_BROWSER=0），
    # 再把这里调回 256m，只用粘贴凭据的方式添加账号
    mem_limit: ${WB_MEM_LIMIT:-1g}
    # chromium 依赖 /dev/shm，容器默认只有 64MB
    shm_size: ${WB_SHM_SIZE:-256m}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  wb-data:
