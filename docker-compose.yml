services:
  wb-checkin:
    build:
      context: .
      args:
        # 0 = 不装 chromium（镜像小，只能粘贴凭据）；1 = 内置浏览器，可扫码登录
        WB_WITH_BROWSER: "${WB_WITH_BROWSER:-1}"
    image: wb-checkin:latest
    container_name: wb-checkin
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
      # 留空则局域网内任何人可访问，建议在软路由上设置一个访问密码
      WB_PASSWORD: "${WB_PASSWORD:-}"
      # 留空则自动生成并持久化到 /data/.secret；填写后令牌可跨设备迁移
      WB_SECRET: "${WB_SECRET:-}"
      WB_DOMAIN: "www.workbuddy.cn"
    volumes:
      - ./data:/data
    # 内置 chromium 之后内存占用上一个档：256m 会在扫码时被 OOM 干掉，
    # 只粘贴凭据不用浏览器的话可以调回 256m
    mem_limit: ${WB_MEM_LIMIT:-1g}
    # chromium 默认吃 /dev/shm，容器里只有 64MB，页面一复杂就崩
    shm_size: ${WB_SHM_SIZE:-256m}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
