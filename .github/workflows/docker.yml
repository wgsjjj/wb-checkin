name: build-image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 镜像已发布" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # 真正把镜像跑起来，确认软路由上拉下来就能用
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run image
        run: |
          docker run -d --name wb -p 8787:8787 \
            -e TZ=Asia/Shanghai \
            -e WB_PASSWORD=smoke-test-pass \
            "$IMAGE:latest"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/me > /dev/null; then
              echo "服务在 ${i}0 秒内就绪"
              break
            fi
            sleep 2
          done

      - name: Assert behaviour
        run: |
          set -e
          curl -fsS http://127.0.0.1:8787/api/me | tee me.json
          grep -q '"needLogin": *true' me.json

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/overview)
          echo "未登录访问 /api/overview -> $code"
          test "$code" = "401"

          curl -fsS http://127.0.0.1:8787/ | grep -qi "<title"

          docker exec wb python -c "import cryptography; print('cryptography', cryptography.__version__)"
          echo -n "容器时间: "; docker exec wb date '+%Y-%m-%d %H:%M:%S %Z'
          echo -n "数据目录: "; docker exec wb ls -A /data | tr '\n' ' '; echo

      # 镜像里必须真的能用浏览器，否则「官方登录」会报找不到 Chrome/Edge
      - name: Assert browser usable
        run: |
          set -e
          docker exec wb chromium --version
          # 只做探测，不起浏览器：模块能找到 chromium 就算通过
          docker exec wb python -c "from browser_login import find_browser as f; p,_=f(); print('found:', p); assert p, '镜像里找不到 chromium'"

      - name: Container logs
        if: always()
        run: docker logs wb | tail -30
